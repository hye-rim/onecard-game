<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>원카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }

  #col { width:min(100%, 420px); }
  #wrap { position:relative; width:100%; }
  #hud .item.score .value { font-size:17px; overflow:hidden; text-overflow:ellipsis; }
  #panel { background:rgba(255,255,255,.16); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:8px 8px 10px; display:flex; flex-direction:column; align-items:center; gap:6px; min-height:calc(100dvh - 90px); }
  #opps { width:100%; display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .opp { flex:1; min-width:96px; display:flex; align-items:center; gap:6px; background:#fff; border:3px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); padding:3px 8px; font-size:13px; white-space:nowrap; overflow:hidden; }
  .opp.turn { background:#fff4c2; animation:glow 1s ease-in-out infinite alternate; }
  .opp.out { opacity:.45; filter:grayscale(1); }
  .opp .nm { overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .opp .ct { margin-left:auto; font-size:16px; }
  .opp .ct small { font-size:11px; color:var(--muted); }
  .opp .off { font-size:11px; color:#c0392b; }
  #table { width:100%; display:flex; align-items:center; justify-content:center; gap:14px; padding:4px 0; }
  #info { display:flex; flex-direction:column; align-items:center; gap:4px; min-width:84px; }
  #suitNow { font-size:34px; line-height:1; text-shadow:0 2px 0 var(--ink); background:#fff; border:3px solid var(--ink); border-radius:12px; width:46px; height:46px; display:grid; place-items:center; box-shadow:0 3px 0 var(--ink); }
  #suitNow.red { color:#e0384c; }
  #dirNow { font-size:13px; color:#fff; text-shadow:0 2px 0 var(--ink); }
  #atk { font-size:15px; color:#fff; background:#e0384c; border:3px solid var(--ink); border-radius:999px; padding:1px 10px; box-shadow:0 3px 0 var(--ink); animation:pop .3s ease-out; }
  #atk:empty { display:none; }
  .card { position:relative; flex:none; width:58px; height:84px; background:#fff; border:3px solid var(--ink); border-radius:10px; box-shadow:0 3px 0 var(--ink); color:var(--ink); font-family:inherit; padding:0; display:flex; align-items:center; justify-content:center; user-select:none; }
  .card .c { position:absolute; top:3px; left:4px; font-size:14px; line-height:1; text-align:center; }
  .card .s { font-size:30px; line-height:1; }
  .card.red { color:#e0384c; }
  .card.joker { background:linear-gradient(160deg,#fff 0,#ffe9a8 100%); }
  .card.joker .s { font-size:34px; }
  .card.big { width:78px; height:112px; border-radius:13px; } .card.big .c { font-size:18px; top:5px; left:6px; } .card.big .s { font-size:42px; }
  .card.back { background:repeating-linear-gradient(45deg,#6b5cff 0 7px,#8a7cff 7px 14px); border-color:var(--ink); }
  .card.back .ct { color:#fff; font-size:20px; text-shadow:0 2px 0 var(--ink); }
  #draw { cursor:pointer; }
  #hint { min-height:20px; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; }
  #msg { min-height:36px; font-size:14.5px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; line-height:1.35; }
  #suitPick { display:none; gap:8px; justify-content:center; align-items:center; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); }
  #suitPick button { font:inherit; font-size:26px; width:48px; height:48px; border:3px solid var(--ink); border-radius:12px; background:#fff; box-shadow:0 3px 0 var(--ink); cursor:pointer; padding:0; }
  #suitPick button.red { color:#e0384c; }
  #hand { width:100%; display:flex; align-items:flex-end; overflow-x:auto; padding:18px 8px 6px; min-height:120px; touch-action:pan-x; scrollbar-width:none; margin-top:auto; }
  #hand::-webkit-scrollbar { display:none; }
  #hand .card + .card { margin-left:-18px; }
  #hand .card.can { transform:translateY(-12px); cursor:pointer; z-index:2; }
  #hand .card.dim { filter:brightness(.82); }
  #hand .card.sel { transform:translateY(-22px); box-shadow:0 0 0 3px var(--yellow), 0 3px 0 var(--ink); }
  #hand .card.new { animation:pop .35s ease-out; }
  #actions { display:flex; gap:8px; width:100%; justify-content:center; flex-wrap:wrap; }
  #actions button { font:inherit; font-size:17px; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); padding:6px 18px; cursor:pointer; }
  #actions button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  #actions button:disabled { opacity:.45; cursor:default; }
  #actions #oneBtn { background:#ff5fa2; color:#fff; text-shadow:0 2px 0 var(--ink); }
  #actions #oneBtn.on { background:#4cd964; color:var(--ink); text-shadow:none; }
  #actions #drawBtn.go { animation:glow 1s ease-in-out infinite alternate; }
  @keyframes pop { from { transform:scale(.7); opacity:0; } to { transform:scale(1); opacity:1; } }
  @keyframes glow { from { box-shadow:0 4px 0 var(--ink); } to { box-shadow:0 4px 0 var(--ink), 0 0 12px 3px rgba(255,210,63,.85); } }
  #overlay .plist { display:flex; flex-direction:column; gap:5px; width:min(100%, 260px); }
  #overlay .plist div { background:#fff; color:var(--ink); border:3px solid var(--ink); border-radius:999px; padding:3px 14px; font-size:15px; text-align:left; box-shadow:0 3px 0 var(--ink); }
  #overlay .plist div.you { background:#fff4c2; }
  #overlay .plist div.off { opacity:.5; }
  #overlay .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #overlay .row button { min-width:0; }
  #overlay input {
    background:#fff; border:3px solid var(--ink); color:var(--ink); box-shadow:0 4px 0 var(--ink);
    font-size:18px; font-family:inherit; text-align:center;
    border-radius:999px; padding:8px 16px; width:210px; user-select:text; outline:none;
  }
  #overlay input::placeholder { color:#a99fc9; }
  #overlay input:focus { box-shadow:0 4px 0 var(--ink), 0 0 0 4px rgba(255,210,63,.6); }
  #overlay .join input { width:124px; letter-spacing:.2em; text-transform:uppercase; }
  #overlay .error { font-size:15px; color:#ffb3c4; min-height:1em; paint-order:stroke fill; -webkit-text-stroke:4px var(--ink); }
  #overlay .back { background:none; border:none; box-shadow:none; color:#fff; font-size:16px; cursor:pointer; padding:6px; font-family:inherit; opacity:.9; min-width:0; }
  #overlay .code { color:var(--yellow); font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); font-size:56px; letter-spacing:.16em; font-variant-numeric:tabular-nums; -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  #overlay .dots { display:flex; gap:10px; }
  #overlay .dots span { width:14px; height:14px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); animation:blink 1.2s infinite; }
  #overlay .dots span:nth-child(2) { animation-delay:.2s; }
  #overlay .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }
  @media (max-height:700px) {
    #panel { gap:4px; padding:6px; } #hand { padding-top:16px; } #actions button { padding:4px 14px; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="value" id="turn">원카드</span></div>
      <div class="item"><span class="label">WIN</span><span class="value" id="wins">0</span></div>
      <div class="icons">
        <button id="resignBtn" title="기권" style="display:none">🏳</button>
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="wrap">
      <div id="panel">
        <div id="opps"></div>
        <div id="table">
          <div class="card back big" id="draw" aria-label="뽑을 카드 더미"><span class="ct" id="drawCt">0</span></div>
          <div id="topCard"></div>
          <div id="info"><div id="suitNow"></div><div id="dirNow"></div><div id="atk"></div></div>
        </div>
        <div id="msg"></div>
        <div id="suitPick"><span>모양 고르기</span></div>
        <div id="hand"></div>
        <div id="actions">
          <button id="drawBtn">🃏 뽑기</button>
          <button id="oneBtn">☝️ 원카드!</button>
        </div>
      </div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
